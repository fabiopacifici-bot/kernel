services:
  kernel:
    build: .
    container_name: kernel
    restart: unless-stopped
    ports:
    - 8769:8769
    volumes:
    - /mnt/e/models/huggingface:/models:ro
    - kernel-memory:/root
    - kernel-ecosystem:/data/ecosystem
    environment:
    - HF_HOME=/models
    - TRANSFORMERS_CACHE=/models
    - SKILLS_DIR=${SKILLS_DIR:-/app/skills}
    - ROUTINES_DIR=${ROUTINES_DIR:-/app/routines}
    - ECOSYSTEM_CACHE=/data/ecosystem
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    command: 'python -m uvicorn api:app --host 0.0.0.0 --port 8769

      '
    working_dir: /app/src
  kernel-cli:
    build: .
    container_name: kernel-cli
    profiles:
    - cli
    stdin_open: true
    tty: true
    volumes:
    - /mnt/e/models/huggingface:/models:ro
    - kernel-memory:/root
    environment:
    - HF_HOME=/models
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    command: ./kernel
    working_dir: /app/src
  kernel-hub:
    build: .
    container_name: kernel-hub
    profiles:
    - docker-model
    restart: unless-stopped
    ports:
    - 8769:8769
    volumes:
    - kernel-memory:/root
    environment:
    - MODEL_SOURCE=docker-hub
    - MODEL_ID=gemma4
    - DOCKER_MODEL_RUNNER_ENDPOINT=http://model-runner:8080
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    command: 'python -m uvicorn api:app --host 0.0.0.0 --port 8769

      '
    working_dir: /app/src
  kernel-hub-cli:
    build: .
    container_name: kernel-hub-cli
    profiles:
    - docker-model-cli
    stdin_open: true
    tty: true
    volumes:
    - kernel-memory:/root
    environment:
    - MODEL_SOURCE=docker-hub
    - MODEL_ID=gemma4
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    command: ./kernel
    working_dir: /app/src
volumes:
  kernel-memory: null
  kernel-ecosystem: null
